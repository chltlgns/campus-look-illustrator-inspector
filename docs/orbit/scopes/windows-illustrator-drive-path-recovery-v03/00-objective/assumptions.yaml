schema_version: orbit-assumptions/v1
status: ready
assumptions:
  - id: A-001
    statement: "Windows rooted drive-letter path를 forward slash로 정규화하면 wslpath가 공백 유무와 무관하게 처리한다."
    risk: critical
    state: verified
    owner: codex
    verification: "실제 LocalAppData runtime raw 입력은 exit 1이었고 C:/... normalized 입력은 exit 0과 정확한 /mnt/c/...를 반환했다."
  - id: A-002
    statement: "공백·한글 palette path도 forward-slash normalized input에서 손실 없이 변환된다."
    risk: high
    state: partially_verified
    owner: codex
    verification: "wslpath exit 0을 확인했다. 실제 palette cache와 report contract에서 최종 검증한다."
  - id: A-003
    statement: "현재 지정 test AI active document는 saved readiness를 유지한다."
    risk: critical
    state: verified
    owner: shared
    verification: "rollback 뒤 process 1, documents 4, active-in-designated-root=true, Saved=true를 관찰했다. actual 직전 재확인한다."
  - id: A-004
    statement: "Program JSX는 다음 설치 직전에도 integrated source의 expected installed hash와 같다."
    risk: critical
    state: verified
    owner: codex
    verification: "현재 SHA-256 e0ed0de80902444470941e2804c88844e3e6535caada9e1e066a96dbe5f027e4와 mtime이 이전 관찰과 같다. 설치 직전 재확인한다."
  - id: A-005
    statement: "지정 폴더 20개 AI와 명시적 default palette가 실제 회귀 입력으로 계속 존재한다."
    risk: high
    state: verified
    owner: shared
    verification: "AI 20개와 palette length/hash를 읽기 전용으로 확인했다. actual 직전 존재성과 hash를 재확인한다."
  - id: A-006
    statement: "v02 failure 뒤 legacy 설치와 empty runtime 복원이 후속 fresh backup의 올바른 pre-state다."
    risk: high
    state: verified
    owner: codex
    verification: "rollback exit 0, 9-entry mismatch 0, resolver/sidecar absent, runtime file count 0을 확인했다."
