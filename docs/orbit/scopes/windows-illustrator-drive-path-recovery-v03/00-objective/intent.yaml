    - "saved active 지정 AI로 Quiet cold/warm, report 계약, 20개 batch/multi-design, active, Start Menu, 실제 Ctrl+Shift+Q와 새 성능 측정"
  out:
    - "analyzer 판정·report schema·PASS/REVIEW/FAIL 의미 변경"
    - "UNC parser·rollback 계약의 재설계 또는 legacy/parent 정리"
    - "기존 열린 문서 저장·종료, Illustrator restart, Program JSX drift 시 write"
    - "remote·push·PR·배포·network install·외부 API·유료 호출"
