hard_boundaries:
  - "새 Gate 승인 전 source 구현·Windows 재설치를 하지 않는다."
  - "Program JSX expected hash와 current hash가 다르면 설치 전에 BLOCKED한다."
  - "actual 실행 직전 active document가 지정 폴더 안이고 Saved=true인지 다시 확인한다."
  - "legacy source, campus-look-ops, 기존 열린 문서, 보존 worktree를 수정·reset·clean·삭제하지 않는다."
  - "현재 대화의 구체적 승인 없이 과금 가능 API를 호출하지 않는다."
success_criteria:
  - id: SC-001
    criterion: "공백 없는 C-drive LocalAppData runtime이 정확한 /mnt/c 경로로 변환되고 malformed drive path는 inspector_root_invalid로 차단된다."
  - id: SC-002
    criterion: "기존 26개와 신규 drive-path locked validation, candidate Quality, clean Trust, ff-only integration, post-Quality가 PASS한다."
  - id: SC-003
    criterion: "fresh backup 뒤 기본 C-drive runtime sidecar로 재설치되고 Program JSX·기존 문서는 불변이다."
  - id: SC-004
    criterion: "지정 AI 실제 Quiet cold/warm과 report·batch/multi·active·shortcut·hotkey 계약이 PASS하고 새 성능이 과거 0.82초와 별도로 기록된다."
  - id: SC-005
    criterion: "실패 시 current=expected-post인 대상만 rollback되고 parent·legacy·customer data·remote/API 경계가 보존된다."
