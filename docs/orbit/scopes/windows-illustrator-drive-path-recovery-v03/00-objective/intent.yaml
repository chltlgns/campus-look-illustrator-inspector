    - "공백 없는 LocalAppData runtime과 공백·한글 palette path의 positive 회귀, malformed drive path fail-closed"
    - "문서·migration target hash·기존 locked 26개와 신규 recovery validation·Quality profile 갱신"
    - "candidate Quality, 다른 verifier clean Trust, main ff-only 통합과 post-Quality"
